name: ClickUp Sync

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      pr_title:
        required: true
        type: string
      pr_url:
        required: true
        type: string
      pr_branch:
        required: true
        type: string
      pr_author:
        required: true
        type: string
      pr_body:
        required: false
        type: string
      repo:
        required: false
        type: string
        default: ""
      merged:
        required: false
        type: boolean
        default: false
      merged_by:
        required: false
        type: string
      pr_draft:
        required: false
        type: boolean
        default: false
      review_state:
        required: false
        type: string
        default: ""
      reviewer:
        required: false
        type: string
        default: ""
    secrets:
      CLICKUP_API_TOKEN:
        required: true

jobs:
  pr-opened:
    if: inputs.base_ref == 'dev' && ((inputs.action == 'opened' && inputs.pr_draft != true) || inputs.action == 'ready_for_review')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extrair ID da task do ClickUp (branch primeiro, descrição como fallback)
        id: extract
        shell: bash
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          normalize() {
            local id="$1"
            if [[ "$id" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "${id^^}"
            else
              echo "$id"
            fi
          }

          TASK_ID=""
          shopt -s nocasematch
          if [[ "$PR_BRANCH" =~ (ONIL-[0-9]+) ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[1]}")
          elif [[ "$PR_BODY" =~ \*\*ClickUp:\*\*[[:space:]]*\<?(https://app\.clickup\.com/t/)?([A-Za-z0-9]+-[0-9]+|[A-Za-z0-9]+)\>? ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[2]}")
          fi
          shopt -u nocasematch

          if [[ -n "$TASK_ID" ]]; then
            echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            if [[ "$TASK_ID" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "qs=custom_task_ids=true&team_id=90171059720" >> "$GITHUB_OUTPUT"
            else
              echo "qs=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task para "code review"
        id: move_status
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
        run: |
          STATUS_CODE=$(curl -s -o /tmp/clickup_status.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "code review"}')
          echo "http_status=${STATUS_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clickup_status.json
          fi

      - name: Criar subtask de Code Review
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          REPO: ${{ inputs.repo }}
          LIST_ID: "901715099907"
          FIELD_EQUIPE: "bf0b9d1c-7c65-410a-a74e-ed75009003f5"
          OPTION_MOBILE: "a3145da6-72d6-4324-9413-33b1060d4231"
          FIELD_SISTEMA: "2424f2c6-fe24-4b4f-a766-b8c7cb17a157"
          OPTION_SEJA: "0cd17024-51b1-47a5-8f27-e190fe63726c"
          OPTION_ONIAPP: "4eefe1db-bbc9-4c91-b154-0e54d923db6d"
        run: |
          # custom_task_ids na query só resolve o ID na URL, não o campo "parent"
          # do corpo — por isso, para IDs customizados (ONIL-N), primeiro
          # buscamos o ID interno real da task pai.
          PARENT_ID="$TASK_ID"
          if [ -n "$QS" ]; then
            PARENT_ID=$(curl -s "https://api.clickup.com/api/v2/task/${TASK_ID}?${QS}" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" | jq -r '.id')
          fi

          # Equipe é sempre Mobile (é o único time que roda esse workflow).
          # Sistema é inferido do nome do repo — mesma lógica/IDs da skill clickup-card.
          CUSTOM_FIELDS=$(jq -n --arg field "$FIELD_EQUIPE" --arg value "$OPTION_MOBILE" \
            '[{id: $field, value: $value}]')
          case "${REPO,,}" in
            *seja*)
              CUSTOM_FIELDS=$(echo "$CUSTOM_FIELDS" | jq --arg field "$FIELD_SISTEMA" --arg opt "$OPTION_SEJA" \
                '. + [{id: $field, value: [$opt]}]')
              ;;
            *oniapp*|*oni-app*)
              CUSTOM_FIELDS=$(echo "$CUSTOM_FIELDS" | jq --arg field "$FIELD_SISTEMA" --arg opt "$OPTION_ONIAPP" \
                '. + [{id: $field, value: [$opt]}]')
              ;;
            *)
              echo "::warning::Não deu pra inferir o Sistema pelo nome do repo '${REPO}' — campo ficou vazio na subtask."
              ;;
          esac

          NAME="Code Review — PR #${PR_NUMBER}: ${PR_TITLE}"
          DESC=$(printf '**PR:** [%s](%s)\n**Branch:** `%s`\n**Autor:** %s\n\nRevisar as mudanças desta branch antes de aprovar o merge para `dev`.' "$PR_TITLE" "$PR_URL" "$PR_BRANCH" "$PR_AUTHOR")
          PAYLOAD=$(jq -n --arg name "$NAME" --arg desc "$DESC" --arg parent "$PARENT_ID" --argjson custom_fields "$CUSTOM_FIELDS" \
            '{name: $name, markdown_description: $desc, parent: $parent, priority: 2, custom_fields: $custom_fields}')
          RESPONSE=$(curl -s -X POST "https://api.clickup.com/api/v2/list/${LIST_ID}/task" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE"
          if echo "$RESPONSE" | jq -e '.err' >/dev/null 2>&1; then
            echo "::warning::Falha ao criar subtask de Code Review: $(echo "$RESPONSE" | jq -r '.err')"
          fi

      - name: Notificar no chat "Dev. Mobile"
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
        run: |
          CONTENT="🔍 **[${PR_TITLE}](${PR_URL})** entrou em code review — [task](https://app.clickup.com/t/${TASK_ID})"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{type: "message", content: $content, content_format: "text/md"}')
          for attempt in 1 2 3; do
            RESPONSE=$(curl -s -X POST "https://api.clickup.com/api/v3/workspaces/90171059720/chat/channels/6-901715099907-8/messages" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1 && break
            sleep 2
          done
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "::warning::Falha ao notificar chat após 3 tentativas: $RESPONSE"
          fi

      - name: Comentar na task do ClickUp
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          COMMENT=$(printf '🔍 PR [%s](%s) (`%s`) entrou em code review.' "$PR_TITLE" "$PR_URL" "$PR_BRANCH")
          PAYLOAD=$(jq -n --arg text "$COMMENT" '{comment_text: $text}')
          curl -s -X POST "https://api.clickup.com/api/v2/task/${TASK_ID}/comment${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null

      - name: Avisar no PR — link do ClickUp não encontrado
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '⚠️ Card do ClickUp não foi movido automaticamente: nomeie a branch com o ID da task (ex: `feature/ONIL-1234-slug`) ou cole o ID/link na descrição do PR (ex: `**ClickUp:** ONIL-1234`, sem `<` `>` ao redor).'
            })

  pr-merged:
    if: inputs.action == 'closed' && inputs.merged == true && inputs.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extrair ID da task do ClickUp (branch primeiro, descrição como fallback)
        id: extract
        shell: bash
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          normalize() {
            local id="$1"
            if [[ "$id" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "${id^^}"
            else
              echo "$id"
            fi
          }

          TASK_ID=""
          shopt -s nocasematch
          if [[ "$PR_BRANCH" =~ (ONIL-[0-9]+) ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[1]}")
          elif [[ "$PR_BODY" =~ \*\*ClickUp:\*\*[[:space:]]*\<?(https://app\.clickup\.com/t/)?([A-Za-z0-9]+-[0-9]+|[A-Za-z0-9]+)\>? ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[2]}")
          fi
          shopt -u nocasematch

          if [[ -n "$TASK_ID" ]]; then
            echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            if [[ "$TASK_ID" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "qs=custom_task_ids=true&team_id=90171059720" >> "$GITHUB_OUTPUT"
            else
              echo "qs=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task para "concluído"
        id: move_status
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
        run: |
          STATUS_CODE=$(curl -s -o /tmp/clickup_status.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "concluído"}')
          echo "http_status=${STATUS_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clickup_status.json
          fi

      - name: Mover subtask de Code Review para "concluído" e atribuir a quem mergeou
        id: subtask
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGED_BY: ${{ inputs.merged_by }}
        run: |
          # Mapeamento de login do GitHub -> ID de usuário no ClickUp (time Dev. Mobile)
          declare -A GH_TO_CLICKUP=(
            [marcelomafradev]=216126674
            [CamilaNevesLinder]=216126615
            [Cdobruski]=216126654
            [StosGuilherme]=216126644
            [elisaeleoterio]=216173206
          )
          ASSIGNEE_ID="${GH_TO_CLICKUP[$MERGED_BY]:-}"

          RESPONSE=$(curl -s "https://api.clickup.com/api/v2/task/${TASK_ID}?include_subtasks=true${QS:+&$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}")
          SUBTASK_ID=$(echo "$RESPONSE" | jq -r --arg pr "PR #${PR_NUMBER}:" '.subtasks[]? | select(.name | contains($pr)) | .id' | head -n1)

          if [ -n "$SUBTASK_ID" ]; then
            if [ -n "$ASSIGNEE_ID" ]; then
              PAYLOAD=$(jq -n --argjson assignee "$ASSIGNEE_ID" '{status: "concluído", assignees: {add: [$assignee]}}')
            else
              PAYLOAD='{"status": "concluído"}'
            fi
            curl -s -X PUT "https://api.clickup.com/api/v2/task/${SUBTASK_ID}" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          fi

      - name: Notificar no chat "Dev. Mobile"
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          MERGED_BY: ${{ inputs.merged_by }}
        run: |
          CONTENT="✅ **[${PR_TITLE}](${PR_URL})** foi mergeado por **${MERGED_BY}** — [task](https://app.clickup.com/t/${TASK_ID}) concluída"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{type: "message", content: $content, content_format: "text/md"}')
          for attempt in 1 2 3; do
            RESPONSE=$(curl -s -X POST "https://api.clickup.com/api/v3/workspaces/90171059720/chat/channels/6-901715099907-8/messages" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1 && break
            sleep 2
          done
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "::warning::Falha ao notificar chat após 3 tentativas: $RESPONSE"
          fi

      - name: Comentar na task do ClickUp
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          MERGED_BY: ${{ inputs.merged_by }}
        run: |
          COMMENT=$(printf '✅ PR [%s](%s) foi mergeado por **%s**.' "$PR_TITLE" "$PR_URL" "$MERGED_BY")
          PAYLOAD=$(jq -n --arg text "$COMMENT" '{comment_text: $text}')
          curl -s -X POST "https://api.clickup.com/api/v2/task/${TASK_ID}/comment${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null

      - name: Avisar no PR — link do ClickUp não encontrado
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '⚠️ Card do ClickUp não foi movido: nenhuma task encontrada — nem no nome da branch (ex: `feature/ONIL-1234-slug`) nem na descrição do PR (`**ClickUp:** ONIL-1234`).'
            })

  pr-closed-unmerged:
    if: inputs.action == 'closed' && inputs.merged == false && inputs.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extrair ID da task do ClickUp (branch primeiro, descrição como fallback)
        id: extract
        shell: bash
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          normalize() {
            local id="$1"
            if [[ "$id" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "${id^^}"
            else
              echo "$id"
            fi
          }

          TASK_ID=""
          shopt -s nocasematch
          if [[ "$PR_BRANCH" =~ (ONIL-[0-9]+) ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[1]}")
          elif [[ "$PR_BODY" =~ \*\*ClickUp:\*\*[[:space:]]*\<?(https://app\.clickup\.com/t/)?([A-Za-z0-9]+-[0-9]+|[A-Za-z0-9]+)\>? ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[2]}")
          fi
          shopt -u nocasematch

          if [[ -n "$TASK_ID" ]]; then
            echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            if [[ "$TASK_ID" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "qs=custom_task_ids=true&team_id=90171059720" >> "$GITHUB_OUTPUT"
            else
              echo "qs=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task de volta para "em andamento"
        id: move_status
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
        run: |
          STATUS_CODE=$(curl -s -o /tmp/clickup_status.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "em andamento"}')
          echo "http_status=${STATUS_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clickup_status.json
          fi

      - name: Descartar subtask de Code Review
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          RESPONSE=$(curl -s "https://api.clickup.com/api/v2/task/${TASK_ID}?include_subtasks=true${QS:+&$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}")
          SUBTASK_ID=$(echo "$RESPONSE" | jq -r --arg pr "PR #${PR_NUMBER}:" '.subtasks[]? | select(.name | contains($pr)) | .id' | head -n1)

          if [ -n "$SUBTASK_ID" ]; then
            curl -s -X PUT "https://api.clickup.com/api/v2/task/${SUBTASK_ID}" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"status": "descartado"}'
          fi

      - name: Notificar no chat "Dev. Mobile"
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
        run: |
          CONTENT="❌ **[${PR_TITLE}](${PR_URL})** foi fechado sem merge — [task](https://app.clickup.com/t/${TASK_ID}) voltou para \"em andamento\""
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{type: "message", content: $content, content_format: "text/md"}')
          for attempt in 1 2 3; do
            RESPONSE=$(curl -s -X POST "https://api.clickup.com/api/v3/workspaces/90171059720/chat/channels/6-901715099907-8/messages" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1 && break
            sleep 2
          done
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "::warning::Falha ao notificar chat após 3 tentativas: $RESPONSE"
          fi

      - name: Avisar no PR — link do ClickUp não encontrado
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '⚠️ PR fechado sem merge, mas nenhuma task do ClickUp foi encontrada (branch/descrição sem ID).'
            })

  pr-review:
    if: inputs.action == 'review' && inputs.base_ref == 'dev' && (inputs.review_state == 'changes_requested' || inputs.review_state == 'approved')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extrair ID da task do ClickUp (branch primeiro, descrição como fallback)
        id: extract
        shell: bash
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          normalize() {
            local id="$1"
            if [[ "$id" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "${id^^}"
            else
              echo "$id"
            fi
          }

          TASK_ID=""
          shopt -s nocasematch
          if [[ "$PR_BRANCH" =~ (ONIL-[0-9]+) ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[1]}")
          elif [[ "$PR_BODY" =~ \*\*ClickUp:\*\*[[:space:]]*\<?(https://app\.clickup\.com/t/)?([A-Za-z0-9]+-[0-9]+|[A-Za-z0-9]+)\>? ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[2]}")
          fi
          shopt -u nocasematch

          if [[ -n "$TASK_ID" ]]; then
            echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            if [[ "$TASK_ID" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "qs=custom_task_ids=true&team_id=90171059720" >> "$GITHUB_OUTPUT"
            else
              echo "qs=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task para "em alteração/teste" (mudanças solicitadas)
        id: move_status
        if: steps.extract.outputs.found == 'true' && inputs.review_state == 'changes_requested'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
        run: |
          STATUS_CODE=$(curl -s -o /tmp/clickup_status.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "em alteração/teste"}')
          echo "http_status=${STATUS_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clickup_status.json
          fi

      - name: Comentar na task do ClickUp
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
          PR_URL: ${{ inputs.pr_url }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEW_STATE: ${{ inputs.review_state }}
        run: |
          if [ "$REVIEW_STATE" = "changes_requested" ]; then
            COMMENT="🔁 ${REVIEWER} solicitou mudanças no PR: ${PR_URL}"
          else
            COMMENT="✅ ${REVIEWER} aprovou o PR: ${PR_URL}"
          fi
          PAYLOAD=$(jq -n --arg text "$COMMENT" '{comment_text: $text}')
          curl -s -X POST "https://api.clickup.com/api/v2/task/${TASK_ID}/comment${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null

      - name: Notificar no chat "Dev. Mobile"
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          REVIEWER: ${{ inputs.reviewer }}
          REVIEW_STATE: ${{ inputs.review_state }}
        run: |
          if [ "$REVIEW_STATE" = "changes_requested" ]; then
            CONTENT="🔁 **${REVIEWER}** solicitou mudanças em **[${PR_TITLE}](${PR_URL})** — [task](https://app.clickup.com/t/${TASK_ID}) voltou para \"em alteração/teste\""
          else
            CONTENT="✅ **${REVIEWER}** aprovou **[${PR_TITLE}](${PR_URL})** — [task](https://app.clickup.com/t/${TASK_ID}) pronta pra merge"
          fi
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{type: "message", content: $content, content_format: "text/md"}')
          for attempt in 1 2 3; do
            RESPONSE=$(curl -s -X POST "https://api.clickup.com/api/v3/workspaces/90171059720/chat/channels/6-901715099907-8/messages" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1 && break
            sleep 2
          done
          if ! echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "::warning::Falha ao notificar chat após 3 tentativas: $RESPONSE"
          fi

      - name: Avisar no PR — link do ClickUp não encontrado
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '⚠️ Review registrada, mas nenhuma task do ClickUp foi encontrada (branch/descrição sem ID).'
            })

  branch-created:
    if: inputs.action == 'branch_created'
    runs-on: ubuntu-latest
    steps:
      - name: Extrair ID da task do ClickUp a partir do nome da branch
        id: extract
        shell: bash
        env:
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          normalize() {
            local id="$1"
            if [[ "$id" =~ ^[A-Za-z]+-[0-9]+$ ]]; then
              echo "${id^^}"
            else
              echo "$id"
            fi
          }

          TASK_ID=""
          shopt -s nocasematch
          if [[ "$PR_BRANCH" =~ (ONIL-[0-9]+) ]]; then
            TASK_ID=$(normalize "${BASH_REMATCH[1]}")
          fi
          shopt -u nocasematch

          if [[ -n "$TASK_ID" ]]; then
            echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "qs=custom_task_ids=true&team_id=90171059720" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task para "em andamento"
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          QS: ${{ steps.extract.outputs.qs }}
        run: |
          curl -s -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}${QS:+?$QS}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "em andamento"}'
