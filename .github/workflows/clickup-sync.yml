name: ClickUp Sync

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      pr_title:
        required: true
        type: string
      pr_url:
        required: true
        type: string
      pr_branch:
        required: true
        type: string
      pr_author:
        required: true
        type: string
      pr_body:
        required: false
        type: string
      merged:
        required: false
        type: boolean
        default: false
      merged_by:
        required: false
        type: string
    secrets:
      CLICKUP_API_TOKEN:
        required: true

jobs:
  pr-opened:
    if: inputs.action == 'opened' && inputs.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extrair ID da task do ClickUp da descrição do PR
        id: extract
        shell: bash
        env:
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          if [[ "$PR_BODY" =~ \*\*ClickUp:\*\*[[:space:]]*(https://app\.clickup\.com/t/)?([a-zA-Z0-9]+) ]]; then
            echo "task_id=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task para "code review"
        id: move_status
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
        run: |
          STATUS_CODE=$(curl -s -o /tmp/clickup_status.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "code review"}')
          echo "http_status=${STATUS_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clickup_status.json
          fi

      - name: Criar subtask de Code Review
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          LIST_ID: "901715099907"
        run: |
          NAME="Code Review — PR #${PR_NUMBER}: ${PR_TITLE}"
          DESC=$(printf '**PR:** [%s](%s)\n**Branch:** `%s`\n**Autor:** %s\n\nRevisar as mudanças desta branch antes de aprovar o merge para `dev`.' "$PR_TITLE" "$PR_URL" "$PR_BRANCH" "$PR_AUTHOR")
          PAYLOAD=$(jq -n --arg name "$NAME" --arg desc "$DESC" --arg parent "$TASK_ID" \
            '{name: $name, markdown_description: $desc, parent: $parent, priority: 2}')
          curl -s -X POST "https://api.clickup.com/api/v2/list/${LIST_ID}/task" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notificar no chat "Dev. Mobile"
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
        run: |
          CONTENT="🔍 **[${PR_TITLE}](${PR_URL})** entrou em code review — [task](https://app.clickup.com/t/${TASK_ID})"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{type: "message", content: $content, content_format: "text/md"}')
          curl -s -X POST "https://api.clickup.com/api/v3/workspaces/90171059720/chat/channels/6-901715099907-8/messages" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Avisar no PR — link do ClickUp não encontrado
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '⚠️ Card do ClickUp não foi movido automaticamente: cole o link da task do ClickUp (https://app.clickup.com/t/...) na descrição deste PR.'
            })

  pr-merged:
    if: inputs.action == 'closed' && inputs.merged == true && inputs.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Extrair ID da task do ClickUp da descrição do PR
        id: extract
        shell: bash
        env:
          PR_BODY: ${{ inputs.pr_body }}
        run: |
          if [[ "$PR_BODY" =~ \*\*ClickUp:\*\*[[:space:]]*(https://app\.clickup\.com/t/)?([a-zA-Z0-9]+) ]]; then
            echo "task_id=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover task para "concluído"
        id: move_status
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
        run: |
          STATUS_CODE=$(curl -s -o /tmp/clickup_status.json -w "%{http_code}" \
            -X PUT "https://api.clickup.com/api/v2/task/${TASK_ID}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "concluído"}')
          echo "http_status=${STATUS_CODE}" >> "$GITHUB_OUTPUT"
          if [ "$STATUS_CODE" = "200" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            cat /tmp/clickup_status.json
          fi

      - name: Mover subtask de Code Review para "concluído" e atribuir a quem mergeou
        id: subtask
        if: steps.extract.outputs.found == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGED_BY: ${{ inputs.merged_by }}
        run: |
          # Mapeamento de login do GitHub -> ID de usuário no ClickUp (time Dev. Mobile)
          declare -A GH_TO_CLICKUP=(
            [marcelomafradev]=216126674
            [CamilaNevesLinder]=216126615
            [Cdobruski]=216126654
            [StosGuilherme]=216126644
            [elisaeleoterio]=216173206
          )
          ASSIGNEE_ID="${GH_TO_CLICKUP[$MERGED_BY]:-}"

          RESPONSE=$(curl -s "https://api.clickup.com/api/v2/task/${TASK_ID}?include_subtasks=true" \
            -H "Authorization: ${CLICKUP_API_TOKEN}")
          SUBTASK_ID=$(echo "$RESPONSE" | jq -r --arg pr "PR #${PR_NUMBER}:" '.subtasks[]? | select(.name | contains($pr)) | .id' | head -n1)

          if [ -n "$SUBTASK_ID" ]; then
            if [ -n "$ASSIGNEE_ID" ]; then
              PAYLOAD=$(jq -n --argjson assignee "$ASSIGNEE_ID" '{status: "concluído", assignees: {add: [$assignee]}}')
            else
              PAYLOAD='{"status": "concluído"}'
            fi
            curl -s -X PUT "https://api.clickup.com/api/v2/task/${SUBTASK_ID}" \
              -H "Authorization: ${CLICKUP_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          fi

      - name: Notificar no chat "Dev. Mobile"
        if: steps.extract.outputs.found == 'true' && steps.move_status.outputs.success == 'true'
        shell: bash
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          TASK_ID: ${{ steps.extract.outputs.task_id }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          MERGED_BY: ${{ inputs.merged_by }}
        run: |
          CONTENT="✅ **[${PR_TITLE}](${PR_URL})** foi mergeado por **${MERGED_BY}** — [task](https://app.clickup.com/t/${TASK_ID}) concluída"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{type: "message", content: $content, content_format: "text/md"}')
          curl -s -X POST "https://api.clickup.com/api/v3/workspaces/90171059720/chat/channels/6-901715099907-8/messages" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Avisar no PR — link do ClickUp não encontrado
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: '⚠️ Card do ClickUp não foi movido: nenhum link de task do ClickUp foi encontrado na descrição deste PR.'
            })
